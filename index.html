<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Müfredat — Kur'an Kavramları Sözlüğü</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #f5f0e8;
    --sidebar-bg: #1a1410;
    --sidebar-text: #e8dcc8;
    --sidebar-muted: #8a7a65;
    --sidebar-hover: #2a2018;
    --sidebar-active: #3d2e1e;
    --accent: #c8860a;
    --accent-light: #e8a420;
    --header-bg: #1a1410;
    --header-text: #e8dcc8;
    --canvas-bg: #e8e0d0;
    --page-shadow: 0 2px 12px rgba(0,0,0,0.25);
    --toolbar-bg: #2a2018;
    --toolbar-text: #d4c4a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  /* HEADER */
  header {
    background: var(--header-bg);
    color: var(--header-text);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    height: 52px;
    flex-shrink: 0;
    border-bottom: 1px solid #3a2e20;
    z-index: 100;
  }
  .logo {
    font-size: 20px;
    font-weight: bold;
    color: var(--accent-light);
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .logo span {
    font-size: 11px;
    color: var(--sidebar-muted);
    display: block;
    font-weight: normal;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: -2px;
  }
  .header-divider { width: 1px; height: 28px; background: #3a2e20; }
  .page-nav {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }
  .nav-btn {
    background: var(--toolbar-bg);
    border: 1px solid #4a3a28;
    color: var(--toolbar-text);
    width: 30px; height: 30px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .nav-btn:hover { background: var(--sidebar-active); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  #page-input {
    background: var(--toolbar-bg);
    border: 1px solid #4a3a28;
    color: var(--toolbar-text);
    width: 56px; height: 30px;
    border-radius: 4px;
    text-align: center;
    font-size: 13px;
    font-family: inherit;
  }
  .page-total { font-size: 13px; color: var(--sidebar-muted); white-space: nowrap; }
  .zoom-group {
    display: flex; align-items: center; gap: 6px; margin-left: auto;
  }
  .zoom-select {
    background: var(--toolbar-bg);
    border: 1px solid #4a3a28;
    color: var(--toolbar-text);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }
  .search-box {
    display: flex; align-items: center; gap: 6px;
    background: var(--toolbar-bg);
    border: 1px solid #4a3a28;
    border-radius: 4px;
    padding: 0 8px;
    height: 30px;
  }
  .search-box input {
    background: transparent;
    border: none;
    color: var(--toolbar-text);
    font-size: 13px;
    width: 160px;
    outline: none;
    font-family: inherit;
  }
  .search-box input::placeholder { color: var(--sidebar-muted); }
  /* LAYOUT */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  /* SIDEBAR */
  aside {
    width: 220px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid #2a2018;
  }
  .sidebar-title {
    padding: 12px 16px 8px;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--sidebar-muted);
    border-bottom: 1px solid #2a2018;
    flex-shrink: 0;
  }
  .sidebar-scroll {
    overflow-y: auto;
    flex: 1;
  }
  .sidebar-scroll::-webkit-scrollbar { width: 4px; }
  .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
  .sidebar-scroll::-webkit-scrollbar-thumb { background: #3a2e20; border-radius: 2px; }
  .chapter-group { border-bottom: 1px solid #2a2018; }
  .chapter-btn {
    width: 100%;
    background: none;
    border: none;
    color: var(--sidebar-text);
    text-align: left;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.12s;
    font-family: inherit;
  }
  .chapter-btn:hover { background: var(--sidebar-hover); }
  .chapter-btn.active { background: var(--sidebar-active); color: var(--accent-light); }
  .chapter-ar {
    font-size: 18px;
    color: var(--accent);
    min-width: 28px;
    text-align: right;
    direction: rtl;
  }
  .chapter-info { display: flex; flex-direction: column; }
  .chapter-name { font-size: 13px; font-weight: bold; }
  .chapter-page { font-size: 11px; color: var(--sidebar-muted); margin-top: 1px; }
  /* VIEWER */
  main {
    flex: 1;
    overflow-y: auto;
    background: var(--canvas-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px;
    gap: 12px;
  }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-track { background: var(--canvas-bg); }
  main::-webkit-scrollbar-thumb { background: #b8a890; border-radius: 4px; }
  .page-wrapper {
    position: relative;
    box-shadow: var(--page-shadow);
    background: white;
    line-height: 0;
  }
  .page-wrapper canvas {
    display: block;
    max-width: 100%;
  }
  .page-num-label {
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #8a7a65;
    white-space: nowrap;
    font-family: sans-serif;
  }
  /* Loading */
  #loading {
    position: fixed;
    inset: 0;
    background: rgba(26,20,16,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    color: var(--sidebar-text);
    gap: 16px;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #3a2e20;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-text { font-size: 14px; color: var(--sidebar-muted); }
  #progress-bar {
    width: 200px; height: 4px;
    background: #3a2e20;
    border-radius: 2px;
    overflow: hidden;
  }
  #progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.3s;
  }
  /* Jump overlay */
  #jump-msg {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--sidebar-active);
    color: var(--accent-light);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-family: sans-serif;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 200;
  }
  #jump-msg.show { opacity: 1; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">PDF yükleniyor...</div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
</div>

<header>
  <div class="logo">Müfredat <span>Kur'an Kavramları Sözlüğü</span></div>
  <div class="header-divider"></div>
  <div class="page-nav">
    <button class="nav-btn" id="btn-first" title="İlk sayfa">⏮</button>
    <button class="nav-btn" id="btn-prev" title="Önceki">◀</button>
    <input type="number" id="page-input" min="1" value="1">
    <span class="page-total">/ <span id="total-pages">—</span></span>
    <button class="nav-btn" id="btn-next" title="Sonraki">▶</button>
    <button class="nav-btn" id="btn-last" title="Son sayfa">⏭</button>
  </div>
  <div class="zoom-group">
    <div class="search-box">
      <span style="color:var(--sidebar-muted);font-size:12px;">🔍</span>
      <input type="text" id="page-search" placeholder="Sayfaya git...">
    </div>
    <select class="zoom-select" id="zoom-select">
      <option value="0.6">%60</option>
      <option value="0.75">%75</option>
      <option value="0.9" selected>%90</option>
      <option value="1.0">%100</option>
      <option value="1.25">%125</option>
      <option value="1.5">%150</option>
    </select>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="sidebar-title">Bölümler</div>
    <div class="sidebar-scroll" id="chapter-list"></div>
  </aside>
  <main id="viewer"></main>
</div>

<div id="jump-msg">Sayfaya gidiliyor...</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const CHAPTERS = [
  { ar: 'أ', name: 'Elif Harfi', page: 21 },
  { ar: 'ب', name: 'Bâ Harfi', page: 107 },
  { ar: 'ت', name: 'Tâ Harfi', page: 141 },
  { ar: 'ث', name: 'Sâ Harfi', page: 157 },
  { ar: 'ج', name: 'Cîm Harfi', page: 167 },
  { ar: 'ح', name: 'Hâ Harfi', page: 199 },
  { ar: 'خ', name: 'Hı Harfi', page: 267 },
  { ar: 'د', name: 'Dâl Harfi', page: 295 },
  { ar: 'ذ', name: 'Zâl Harfi', page: 319 },
  { ar: 'ر', name: 'Râ Harfi', page: 343 },
  { ar: 'ز', name: 'Zây Harfi', page: 405 },
  { ar: 'س', name: 'Sîn Harfi', page: 419 },
  { ar: 'ش', name: 'Şın Harfi', page: 473 },
  { ar: 'ص', name: 'Sâd Harfi', page: 503 },
  { ar: 'ض', name: 'Dad Harfi', page: 535 },
  { ar: 'ط', name: 'Tı Harfi', page: 553 },
  { ar: 'ظ', name: 'Zı Harfi', page: 571 },
  { ar: 'ع', name: 'Ayn Harfi', page: 583 },
  { ar: 'غ', name: 'Gayn Harfi', page: 641 },
  { ar: 'ف', name: 'Fâ Harfi', page: 659 },
  { ar: 'ق', name: 'Kâf Harfi', page: 713 },
  { ar: 'ك', name: 'Kef Harfi', page: 775 },
  { ar: 'ل', name: 'Lâm Harfi', page: 815 },
  { ar: 'م', name: 'Mîm Harfi', page: 867 },
  { ar: 'ن', name: 'Nûn Harfi', page: 975 },
  { ar: 'و', name: 'Vâv Harfi', page: 1017 },
  { ar: 'ه', name: 'Hâ Harfi', page: 1065 },
  { ar: 'ي', name: 'Yâ Harfi', page: 1109 },
];

let pdfDoc = null;
let currentPage = 1;
let totalPages = 0;
let scale = 0.9;
let renderQueue = [];
let isRendering = false;

const viewer = document.getElementById('viewer');
const pageInput = document.getElementById('page-input');
const totalPagesEl = document.getElementById('total-pages');
const chapterList = document.getElementById('chapter-list');
const jumpMsg = document.getElementById('jump-msg');

function buildSidebar() {
  CHAPTERS.forEach((ch, i) => {
    const div = document.createElement('div');
    div.className = 'chapter-group';
    const btn = document.createElement('button');
    btn.className = 'chapter-btn';
    btn.dataset.page = ch.page;
    btn.dataset.idx = i;
    btn.innerHTML = `
      <span class="chapter-ar">${ch.ar}</span>
      <span class="chapter-info">
        <span class="chapter-name">${ch.name}</span>
        <span class="chapter-page">Sayfa ${ch.page}</span>
      </span>
    `;
    btn.addEventListener('click', () => goToPage(ch.page));
    div.appendChild(btn);
    chapterList.appendChild(div);
  });
}

function updateActiveChapter(page) {
  const btns = chapterList.querySelectorAll('.chapter-btn');
  let active = -1;
  CHAPTERS.forEach((ch, i) => { if (page >= ch.page) active = i; });
  btns.forEach((b, i) => b.classList.toggle('active', i === active));
}

function showJumpMsg(text) {
  jumpMsg.textContent = text;
  jumpMsg.classList.add('show');
  setTimeout(() => jumpMsg.classList.remove('show'), 1800);
}

async function renderPage(pageNum) {
  const page = await pdfDoc.getPage(pageNum);
  const viewport = page.getViewport({ scale });
  const wrapper = document.createElement('div');
  wrapper.className = 'page-wrapper';
  wrapper.id = `page-${pageNum}`;
  wrapper.style.marginBottom = '32px';
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  wrapper.appendChild(canvas);
  const label = document.createElement('div');
  label.className = 'page-num-label';
  label.textContent = `Sayfa ${pageNum}`;
  wrapper.appendChild(label);
  viewer.appendChild(wrapper);
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
}

async function loadPDF() {
  const pdfPath = 'mufredat.pdf';
  const loadingTask = pdfjsLib.getDocument(pdfPath);
  loadingTask.onProgress = (p) => {
    if (p.total) {
      const pct = Math.round(p.loaded / p.total * 100);
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('loading-text').textContent = `PDF yükleniyor... %${pct}`;
    }
  };
  pdfDoc = await loadingTask.promise;
  totalPages = pdfDoc.numPages;
  totalPagesEl.textContent = totalPages;
  pageInput.max = totalPages;
  document.getElementById('loading').style.display = 'none';
  buildSidebar();
  await renderInitialPages();
  setupLazyLoad();
}

async function renderInitialPages() {
  const start = 1;
  const end = Math.min(5, totalPages);
  for (let i = start; i <= end; i++) {
    await renderPage(i);
  }
  currentPage = 1;
  updatePageInput(1);
  updateActiveChapter(1);
}

let renderedPages = new Set([]);
async function renderInitialPages2() {}

function setupLazyLoad() {
  const observer = new IntersectionObserver(async (entries) => {
    for (const entry of entries) {
      if (entry.isIntersecting) {
        const wrapper = entry.target;
        const num = parseInt(wrapper.id.replace('page-', ''));
        updatePageInput(num);
        updateActiveChapter(num);
      }
    }
  }, { threshold: 0.1 });
  viewer.querySelectorAll('.page-wrapper').forEach(w => observer.observe(w));
}

async function goToPage(num) {
  num = Math.max(1, Math.min(totalPages, num));
  showJumpMsg(`Sayfa ${num} yükleniyor...`);
  viewer.innerHTML = '';
  const start = Math.max(1, num - 1);
  const end = Math.min(totalPages, num + 3);
  for (let i = start; i <= end; i++) {
    await renderPage(i);
  }
  currentPage = num;
  updatePageInput(num);
  updateActiveChapter(num);
  setupLazyLoad();
  const target = document.getElementById(`page-${num}`);
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  preloadAhead(end + 1, Math.min(totalPages, end + 5));
}

async function preloadAhead(from, to) {
  for (let i = from; i <= to; i++) {
    if (!document.getElementById(`page-${i}`)) {
      await renderPage(i);
    }
  }
}

function updatePageInput(n) {
  pageInput.value = n;
  currentPage = n;
  document.getElementById('btn-prev').disabled = n <= 1;
  document.getElementById('btn-first').disabled = n <= 1;
  document.getElementById('btn-next').disabled = n >= totalPages;
  document.getElementById('btn-last').disabled = n >= totalPages;
}

document.getElementById('btn-prev').addEventListener('click', () => goToPage(currentPage - 1));
document.getElementById('btn-next').addEventListener('click', () => goToPage(currentPage + 1));
document.getElementById('btn-first').addEventListener('click', () => goToPage(1));
document.getElementById('btn-last').addEventListener('click', () => goToPage(totalPages));

pageInput.addEventListener('change', () => {
  const v = parseInt(pageInput.value);
  if (!isNaN(v)) goToPage(v);
});

document.getElementById('page-search').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const v = parseInt(e.target.value);
    if (!isNaN(v)) { goToPage(v); e.target.value = ''; }
  }
});

document.getElementById('zoom-select').addEventListener('change', async (e) => {
  scale = parseFloat(e.target.value);
  const pg = currentPage;
  viewer.innerHTML = '';
  for (let i = Math.max(1, pg - 1); i <= Math.min(totalPages, pg + 3); i++) {
    await renderPage(i);
  }
  setupLazyLoad();
  const target = document.getElementById(`page-${pg}`);
  if (target) target.scrollIntoView({ block: 'start' });
  preloadAhead(pg + 4, Math.min(totalPages, pg + 8));
});

loadPDF();
</script>
</body>
</html>
