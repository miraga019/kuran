<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Açık Mushaf — Kur'an Okuma ve Kök Kelime Arama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Zilla+Slab:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#F6EFDD;
    --parchment-deep:#EDE2C8;
    --parchment-line:#DCCBA3;
    --ink:#241B12;
    --ink-soft:#4a3c28;
    --teal:#0E4D46;
    --teal-deep:#08302B;
    --gold:#B9922F;
    --gold-soft:#D8BE7C;
    --maroon:#7A2331;
    --muted:#8B7A5E;
    --shadow: 0 4px 18px rgba(36,27,18,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--parchment);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(185,146,47,0.10) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Zilla Slab', serif;
    min-height:100vh;
  }
  ::selection{ background: var(--gold-soft); color:var(--teal-deep); }

  /* ---------- Layout shell ---------- */
  .app{
    display:grid;
    grid-template-columns: 300px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas:
      "header header"
      "sidebar main";
    min-height:100vh;
  }
  @media (max-width: 860px){
    .app{ grid-template-columns: 1fr; grid-template-areas: "header" "sidebar" "main"; }
    .sidebar{ max-height: 320px; }
  }

  /* ---------- Header ---------- */
  header.top{
    grid-area:header;
    background: linear-gradient(180deg, var(--teal-deep), var(--teal));
    color: var(--parchment);
    padding: 22px 28px 18px;
    display:flex;
    align-items:center;
    gap:20px;
    border-bottom: 3px solid var(--gold);
    position:relative;
    overflow:hidden;
  }
  header.top::after{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(circle at 8px 8px, rgba(216,190,124,0.10) 1.4px, transparent 0);
    background-size: 26px 26px;
    pointer-events:none;
  }
  .brand{ display:flex; align-items:center; gap:14px; z-index:1; }
  .brand svg{ width:40px; height:40px; flex-shrink:0; }
  .brand h1{
    font-family:'Amiri', serif;
    font-weight:700;
    font-size:1.5rem;
    margin:0;
    letter-spacing:0.3px;
  }
  .brand p{
    margin:2px 0 0;
    font-size:0.78rem;
    color: var(--gold-soft);
    letter-spacing:0.5px;
    font-family:'IBM Plex Mono', monospace;
    text-transform:uppercase;
  }
  .tabs{
    margin-left:auto;
    display:flex;
    gap:6px;
    z-index:1;
  }
  .tab-btn{
    background:transparent;
    border:1px solid rgba(216,190,124,0.4);
    color: var(--parchment);
    padding:9px 18px;
    border-radius:3px;
    font-family:'Zilla Slab', serif;
    font-size:0.92rem;
    cursor:pointer;
    transition: all .15s ease;
  }
  .tab-btn:hover{ background: rgba(216,190,124,0.12); }
  .tab-btn.active{
    background: var(--gold);
    color: var(--teal-deep);
    border-color: var(--gold);
    font-weight:600;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    grid-area:sidebar;
    background: var(--parchment-deep);
    border-right: 1px solid var(--parchment-line);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .sidebar-search{
    padding:16px;
    border-bottom:1px solid var(--parchment-line);
  }
  .sidebar-search input{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--parchment-line);
    border-radius:3px;
    background: var(--parchment);
    font-family:'Zilla Slab', serif;
    font-size:0.92rem;
    color: var(--ink);
  }
  .sidebar-search input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .surah-list{
    overflow-y:auto;
    flex:1;
  }
  .surah-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 16px;
    cursor:pointer;
    border-bottom:1px solid rgba(220,203,163,0.5);
    transition: background .12s ease;
  }
  .surah-item:hover{ background: rgba(185,146,47,0.10); }
  .surah-item.active{
    background: var(--teal);
    color: var(--parchment);
  }
  .surah-item.active .surah-no{ background:var(--gold); color:var(--teal-deep); }
  .surah-no{
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    flex-shrink:0;
    color: var(--teal-deep);
  }
  .surah-item.active .surah-no{ border-color: var(--gold); }
  .surah-names{ display:flex; flex-direction:column; min-width:0; }
  .surah-names .tr{ font-size:0.94rem; font-weight:500; }
  .surah-names .en{ font-size:0.72rem; color:var(--muted); font-family:'IBM Plex Mono', monospace; }
  .surah-item.active .surah-names .en{ color: var(--gold-soft); }

  /* ---------- Main ---------- */
  main{
    grid-area:main;
    padding: 32px 40px 80px;
    overflow-y:auto;
    max-width: 900px;
  }
  .panel{ display:none; }
  .panel.active{ display:block; }

  .loading, .empty-state{
    color: var(--muted);
    font-style:italic;
    padding: 40px 0;
    text-align:center;
  }

  /* Surah header */
  .surah-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    padding-bottom:22px;
    margin-bottom:26px;
    border-bottom: 2px solid var(--gold-soft);
  }
  .surah-header h2{
    font-family:'Amiri', serif;
    font-size:2.1rem;
    margin:0 0 4px;
    color: var(--teal-deep);
  }
  .surah-header .sub{
    color: var(--muted);
    font-size:0.9rem;
    font-family:'IBM Plex Mono', monospace;
  }
  .surah-controls{ display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
  select#authorSelect{
    padding:7px 10px;
    border:1px solid var(--parchment-line);
    border-radius:3px;
    background: var(--parchment);
    font-family:'Zilla Slab', serif;
    font-size:0.85rem;
    color:var(--ink);
    max-width:220px;
  }
  .play-btn{
    display:flex; align-items:center; gap:8px;
    background: var(--maroon);
    color: var(--parchment);
    border:none;
    padding:8px 16px;
    border-radius:3px;
    cursor:pointer;
    font-family:'Zilla Slab', serif;
    font-size:0.85rem;
    transition: background .15s ease;
  }
  .play-btn:hover{ background:#5e1a24; }

  /* Verse card */
  .verse{
    position:relative;
    padding: 22px 0 26px;
    border-bottom: 1px dashed var(--parchment-line);
  }
  .verse:last-child{ border-bottom:none; }
  .verse-num-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
  }
  .roundel{
    width:30px; height:30px;
    flex-shrink:0;
  }
  .verse-num-row .ref{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.76rem;
    color: var(--muted);
    letter-spacing:0.5px;
  }
  .arabic{
    font-family:'Amiri', serif;
    font-size:1.85rem;
    line-height:2.3;
    text-align:right;
    direction:rtl;
    color: var(--teal-deep);
    margin-bottom:12px;
  }
  .transcription{
    font-size:0.86rem;
    color: var(--muted);
    font-style:italic;
    margin-bottom:8px;
  }
  .translation{
    font-size:1.04rem;
    color: var(--ink);
    line-height:1.6;
  }
  .footnotes{
    margin-top:8px;
    font-size:0.82rem;
    color: var(--ink-soft);
    background: rgba(185,146,47,0.08);
    border-left:3px solid var(--gold);
    padding:8px 12px;
    display:none;
  }
  .footnotes.show{ display:block; }
  .verse-actions{
    margin-top:10px;
    display:flex;
    gap:14px;
  }
  .link-btn{
    background:none;
    border:none;
    color: var(--teal);
    font-family:'Zilla Slab', serif;
    font-size:0.82rem;
    text-decoration: underline;
    cursor:pointer;
    padding:0;
  }
  .link-btn:hover{ color: var(--maroon); }

  .verseparts-box{
    margin-top:14px;
    display:none;
    flex-wrap:wrap;
    gap:10px;
    background: var(--parchment-deep);
    border:1px solid var(--parchment-line);
    border-radius:4px;
    padding:14px;
  }
  .verseparts-box.show{ display:flex; }
  .vp-word{
    background: var(--parchment);
    border:1px solid var(--gold-soft);
    border-radius:4px;
    padding:8px 10px;
    min-width:110px;
    text-align:center;
    cursor:pointer;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .vp-word:hover{ transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--maroon); }
  .vp-word .a{ font-family:'Amiri', serif; font-size:1.3rem; color:var(--teal-deep); direction:rtl; }
  .vp-word .t{ font-size:0.72rem; color:var(--ink-soft); margin-top:3px; }
  .vp-word .r{ font-size:0.68rem; color:var(--muted); font-family:'IBM Plex Mono', monospace; margin-top:3px; }
  .vp-word.no-root{ opacity:0.6; cursor:default; }

  /* ---------- Root search panel ---------- */
  .root-search-box{
    display:flex;
    gap:10px;
    margin-bottom:28px;
  }
  .root-search-box input{
    flex:1;
    padding:12px 16px;
    border:1px solid var(--parchment-line);
    border-radius:3px;
    background: var(--parchment-deep);
    font-family:'Amiri', serif;
    font-size:1.1rem;
    color: var(--ink);
  }
  .root-search-box input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .root-search-box button{
    background: var(--teal);
    color: var(--parchment);
    border:none;
    padding:0 24px;
    border-radius:3px;
    cursor:pointer;
    font-family:'Zilla Slab', serif;
    font-size:0.95rem;
    transition: background .15s ease;
  }
  .root-search-box button:hover{ background: var(--teal-deep); }
  .root-hint{
    font-size:0.8rem;
    color: var(--muted);
    margin-top:-18px;
    margin-bottom:26px;
  }
  .root-hint code{
    background: var(--parchment-deep);
    padding:1px 6px;
    border-radius:3px;
    font-family:'IBM Plex Mono', monospace;
  }

  .root-meaning-card{
    background: var(--parchment-deep);
    border:1px solid var(--gold-soft);
    border-radius:6px;
    padding:22px 26px;
    margin-bottom:26px;
  }
  .root-meaning-card .arabic-root{
    font-family:'Amiri', serif;
    font-size:2.4rem;
    color: var(--teal-deep);
    direction:rtl;
    margin-bottom:6px;
  }
  .root-meaning-card .translit{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    color:var(--muted);
    margin-bottom:14px;
  }
  .root-meaning-card .mean{ font-size:1rem; line-height:1.6; }
  .diffs{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .diff-chip{
    background: var(--parchment);
    border:1px solid var(--parchment-line);
    border-radius:20px;
    padding:5px 14px;
    font-family:'Amiri', serif;
    font-size:1rem;
    direction:rtl;
  }
  .diff-chip .c{ font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color:var(--muted); direction:ltr; margin-left:4px; }

  .occurrence-list h3{
    font-family:'Amiri', serif;
    color: var(--teal-deep);
    font-size:1.2rem;
    margin-bottom:14px;
  }
  .occ-item{
    background: var(--parchment);
    border:1px solid var(--parchment-line);
    border-radius:4px;
    padding:14px 18px;
    margin-bottom:12px;
    cursor:pointer;
    transition: border-color .12s ease;
  }
  .occ-item:hover{ border-color: var(--maroon); }
  .occ-item .occ-ref{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.74rem;
    color: var(--muted);
    margin-bottom:6px;
  }
  .occ-item .occ-arabic{ font-family:'Amiri', serif; font-size:1.15rem; direction:rtl; color:var(--teal-deep); }
  .occ-item .occ-tr{ font-size:0.9rem; margin-top:4px; color:var(--ink-soft); }
  .pager{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:20px;
  }
  .pager button{
    background: var(--parchment-deep);
    border:1px solid var(--parchment-line);
    padding:7px 14px;
    border-radius:3px;
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.8rem;
  }
  .pager button:disabled{ opacity:0.4; cursor:default; }

  /* rootchar grid for browse */
  .rootchar-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:30px;
  }
  .rootchar-chip{
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Amiri', serif;
    font-size:1.2rem;
    background: var(--parchment-deep);
    border:1px solid var(--parchment-line);
    border-radius:50%;
    cursor:pointer;
    color: var(--teal-deep);
  }
  .rootchar-chip:hover{ background: var(--gold-soft); }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-track{ background: var(--parchment); }
  ::-webkit-scrollbar-thumb{ background: var(--parchment-line); border-radius:5px; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="#D8BE7C" stroke-width="1.4"/>
        <circle cx="20" cy="20" r="12" stroke="#D8BE7C" stroke-width="1"/>
        <g stroke="#D8BE7C" stroke-width="1">
          <line x1="20" y1="2" x2="20" y2="8"/>
          <line x1="20" y1="32" x2="20" y2="38"/>
          <line x1="2" y1="20" x2="8" y2="20"/>
          <line x1="32" y1="20" x2="38" y2="20"/>
          <line x1="7" y1="7" x2="11" y2="11"/>
          <line x1="29" y1="29" x2="33" y2="33"/>
          <line x1="7" y1="33" x2="11" y2="29"/>
          <line x1="29" y1="11" x2="33" y2="7"/>
        </g>
        <circle cx="20" cy="20" r="4" fill="#D8BE7C"/>
      </svg>
      <div>
        <h1>Açık Mushaf</h1>
        <p>Kur'an · Meal · Kök Kelime</p>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-panel="read">Oku</button>
      <button class="tab-btn" data-panel="root">Kök Kelime Ara</button>
    </div>
  </header>

  <aside class="sidebar">
    <div class="sidebar-search">
      <input type="text" id="surahFilter" placeholder="Sure ara (ör. Bakara, Yasin)...">
    </div>
    <div class="surah-list" id="surahList">
      <div class="loading">Sureler yükleniyor...</div>
    </div>
  </aside>

  <main>
    <!-- READ PANEL -->
    <section class="panel active" id="panel-read">
      <div id="readContent">
        <div class="empty-state">Soldan bir sure seçerek okumaya başlayın.</div>
      </div>
    </section>

    <!-- ROOT SEARCH PANEL -->
    <section class="panel" id="panel-root">
      <div class="root-search-box">
        <input type="text" id="rootInput" placeholder="Kök harfleri (Latin), örn: Hmd, slm, rHm...">
        <button id="rootSearchBtn">Ara</button>
      </div>
      <p class="root-hint">İpucu: Arapça kökleri Latin harfleriyle yazın — büyük harf ح/ه/خ gibi güçlü sesler için kullanılır. Örn: <code>Hmd</code> (hamd), <code>slm</code> (selam), <code>rHm</code> (rahmet).</p>
      <div class="rootchar-grid" id="rootcharGrid"></div>
      <div id="rootResults"></div>
    </section>
  </main>
</div>

<audio id="surahAudio" style="display:none"></audio>

<script>
const API = 'https://api.acikkuran.com';

let surahs = [];
let authors = [];
let currentAuthor = null;
let currentSurahId = null;
let rootPage = 1;
let currentRootChars = null;

// -------- roundel svg (ayah-end ornament) --------
function roundelSVG(){
  return `<svg class="roundel" viewBox="0 0 30 30" fill="none">
    <circle cx="15" cy="15" r="13" stroke="#B9922F" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="8" stroke="#B9922F" stroke-width="0.8"/>
    <g stroke="#B9922F" stroke-width="0.8">
      <line x1="15" y1="1" x2="15" y2="4"/>
      <line x1="15" y1="26" x2="15" y2="29"/>
      <line x1="1" y1="15" x2="4" y2="15"/>
      <line x1="26" y1="15" x2="29" y2="15"/>
    </g>
  </svg>`;
}

// -------- Tabs --------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.panel).classList.add('active');
  });
});

// -------- Init --------
async function init(){
  try{
    const [surahRes, authorRes] = await Promise.all([
      fetch(`${API}/surahs`).then(r=>r.json()),
      fetch(`${API}/authors`).then(r=>r.json())
    ]);
    surahs = surahRes.data;
    authors = authorRes.data.filter(a=>a.language==='tr');
    if(authors.length===0) authors = authorRes.data;
    currentAuthor = authors[0]?.id || null;
    renderSurahList(surahs);
  }catch(e){
    document.getElementById('surahList').innerHTML = `<div class="empty-state">Sureler yüklenemedi. İnternet bağlantınızı kontrol edin.</div>`;
    console.error(e);
  }

  // rootchar grid
  try{
    const rc = await fetch(`${API}/rootchars`).then(r=>r.json());
    const grid = document.getElementById('rootcharGrid');
    rc.data.forEach(ch=>{
      const chip = document.createElement('div');
      chip.className='rootchar-chip';
      chip.textContent = ch.arabic;
      chip.title = ch.latin;
      chip.addEventListener('click', ()=>{
        document.getElementById('rootInput').value = ch.latin;
      });
      grid.appendChild(chip);
    });
  }catch(e){ console.error(e); }
}

function renderSurahList(list){
  const el = document.getElementById('surahList');
  if(list.length===0){ el.innerHTML = `<div class="empty-state">Sonuç yok.</div>`; return; }
  el.innerHTML = list.map(s=>`
    <div class="surah-item ${s.id===currentSurahId?'active':''}" data-id="${s.id}">
      <div class="surah-no">${s.id}</div>
      <div class="surah-names">
        <span class="tr">${s.name}</span>
        <span class="en">${s.name_en} · ${s.verse_count} ayet</span>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.surah-item').forEach(item=>{
    item.addEventListener('click', ()=> loadSurah(parseInt(item.dataset.id)));
  });
}

document.getElementById('surahFilter').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  const filtered = surahs.filter(s=>
    s.name.toLowerCase().includes(q) || s.name_en.toLowerCase().includes(q)
  );
  renderSurahList(filtered);
});

// -------- Load surah --------
async function loadSurah(id){
  currentSurahId = id;
  document.querySelectorAll('.tab-btn')[0].click();
  renderSurahList(surahs.filter(s=>{
    const q = document.getElementById('surahFilter').value.trim().toLowerCase();
    return s.name.toLowerCase().includes(q) || s.name_en.toLowerCase().includes(q);
  }));
  const content = document.getElementById('readContent');
  content.innerHTML = `<div class="loading">Sure yükleniyor...</div>`;

  try{
    const authorParam = currentAuthor ? `?author=${currentAuthor}` : '';
    const res = await fetch(`${API}/surah/${id}${authorParam}`).then(r=>r.json());
    const s = res.data;

    const authorOptions = authors.map(a=>`<option value="${a.id}" ${a.id==currentAuthor?'selected':''}>${a.name}</option>`).join('');

    let html = `
      <div class="surah-header">
        <div>
          <h2>${s.name} <span style="font-family:'Zilla Slab',serif;font-size:1.1rem;color:var(--muted);">— ${s.name_en}</span></h2>
          <div class="sub">${s.name_original} · ${s.verse_count} ayet · Sayfa ${s.page_number}</div>
        </div>
        <div class="surah-controls">
          <select id="authorSelect">${authorOptions}</select>
          ${s.audio && s.audio.mp3 ? `<button class="play-btn" id="playSurah">▶ Sureyi Dinle</button>` : ''}
        </div>
      </div>
      <div id="versesWrap">
    `;

    s.verses.forEach(v=>{
      html += renderVerse(v, s);
    });

    html += `</div>`;
    content.innerHTML = html;

    document.getElementById('authorSelect').addEventListener('change', (e)=>{
      currentAuthor = e.target.value;
      loadSurah(id);
    });

    const playBtn = document.getElementById('playSurah');
    if(playBtn){
      playBtn.addEventListener('click', ()=>{
        const audio = document.getElementById('surahAudio');
        if(audio.src === s.audio.mp3 && !audio.paused){
          audio.pause();
          playBtn.textContent = '▶ Sureyi Dinle';
        } else {
          audio.src = s.audio.mp3;
          audio.play();
          playBtn.textContent = '❚❚ Duraklat';
        }
      });
    }

    attachVerseHandlers(id);
  }catch(e){
    content.innerHTML = `<div class="empty-state">Sure yüklenemedi.</div>`;
    console.error(e);
  }
}

function renderVerse(v, surah){
  const arabic = v.verse_simplified || v.verse;
  const footnotesHtml = (v.translation && v.translation.footnotes) ? v.translation.footnotes.map(f=>`<div>[${f.number}] ${f.text}</div>`).join('') : '';
  return `
    <div class="verse" data-verse-num="${v.verse_number}">
      <div class="verse-num-row">
        ${roundelSVG()}
        <span class="ref">${surah.name.toUpperCase()} ${surah.id}:${v.verse_number}</span>
      </div>
      <div class="arabic">${arabic}</div>
      <div class="transcription">${v.transcription || ''}</div>
      <div class="translation">${v.translation ? v.translation.text : ''}</div>
      ${footnotesHtml ? `
        <div class="verse-actions">
          <button class="link-btn footnote-toggle">Dipnotları göster</button>
          <button class="link-btn verseparts-toggle" data-surah="${surah.id}" data-verse="${v.verse_number}">Kelime kelime analiz</button>
        </div>
        <div class="footnotes">${footnotesHtml}</div>
      ` : `
        <div class="verse-actions">
          <button class="link-btn verseparts-toggle" data-surah="${surah.id}" data-verse="${v.verse_number}">Kelime kelime analiz</button>
        </div>
      `}
      <div class="verseparts-box"></div>
    </div>
  `;
}

function attachVerseHandlers(surahId){
  document.querySelectorAll('.footnote-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const fn = btn.parentElement.nextElementSibling;
      fn.classList.toggle('show');
      btn.textContent = fn.classList.contains('show') ? 'Dipnotları gizle' : 'Dipnotları göster';
    });
  });

  document.querySelectorAll('.verseparts-toggle').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const box = btn.closest('.verse').querySelector('.verseparts-box');
      if(box.classList.contains('show')){
        box.classList.remove('show');
        btn.textContent = 'Kelime kelime analiz';
        return;
      }
      if(box.dataset.loaded !== 'true'){
        box.innerHTML = `<div class="loading">Yükleniyor...</div>`;
        box.classList.add('show');
        try{
          const res = await fetch(`${API}/surah/${btn.dataset.surah}/verse/${btn.dataset.verse}/verseparts`).then(r=>r.json());
          box.innerHTML = res.data.map(w=>`
            <div class="vp-word ${w.root ? '' : 'no-root'}" ${w.root ? `data-root="${w.root.latin}"` : ''}>
              <div class="a">${w.arabic}</div>
              <div class="t">${w.translation_tr || ''}</div>
              ${w.root ? `<div class="r">${w.root.latin}</div>` : ''}
            </div>
          `).join('');
          box.querySelectorAll('.vp-word[data-root]').forEach(wordEl=>{
            wordEl.addEventListener('click', ()=>{
              document.querySelectorAll('.tab-btn')[1].click();
              document.getElementById('rootInput').value = wordEl.dataset.root;
              searchRoot(wordEl.dataset.root);
            });
          });
          box.dataset.loaded = 'true';
        }catch(e){
          box.innerHTML = `<div class="empty-state">Analiz yüklenemedi.</div>`;
        }
      } else {
        box.classList.add('show');
      }
      btn.textContent = 'Analizi gizle';
    });
  });
}

// -------- Root search --------
document.getElementById('rootSearchBtn').addEventListener('click', ()=>{
  const val = document.getElementById('rootInput').value.trim();
  if(val) searchRoot(val);
});
document.getElementById('rootInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    const val = e.target.value.trim();
    if(val) searchRoot(val);
  }
});

async function searchRoot(chars, page=1){
  currentRootChars = chars;
  rootPage = page;
  const el = document.getElementById('rootResults');
  el.innerHTML = `<div class="loading">Aranıyor...</div>`;

  try{
    const [meaningRes, versesRes] = await Promise.all([
      fetch(`${API}/root/latin/${encodeURIComponent(chars)}`).then(r=>r.json()),
      fetch(`${API}/root/latin/${encodeURIComponent(chars)}/verseparts?page=${page}`).then(r=>r.json())
    ]);

    const root = meaningRes.data;
    const diffsHtml = (root.diffs||[]).map(d=>`<span class="diff-chip">${d.diff} <span class="c">×${d.count}</span></span>`).join('');

    let html = `
      <div class="root-meaning-card">
        <div class="arabic-root">${root.arabic}</div>
        <div class="translit">${root.transcription || ''}</div>
        <div class="mean">${root.mean || ''}</div>
        ${diffsHtml ? `<div class="diffs">${diffsHtml}</div>` : ''}
      </div>
      <div class="occurrence-list">
        <h3>Geçtiği Ayetler ${versesRes.meta ? `(${versesRes.meta.total})` : ''}</h3>
        <div id="occItems"></div>
      </div>
    `;
    el.innerHTML = html;

    const occWrap = document.getElementById('occItems');
    if(!versesRes.data || versesRes.data.length===0){
      occWrap.innerHTML = `<div class="empty-state">Sonuç bulunamadı.</div>`;
    } else {
      occWrap.innerHTML = versesRes.data.map(item=>`
        <div class="occ-item" data-surah="${item.surah.id}" data-verse="${item.verse.verse_number}">
          <div class="occ-ref">${item.surah.name.toUpperCase()} ${item.surah.id}:${item.verse.verse_number}</div>
          <div class="occ-arabic">${item.verse.verse}</div>
          <div class="occ-tr">${item.verse.translation ? item.verse.translation.text : ''}</div>
        </div>
      `).join('');
      occWrap.querySelectorAll('.occ-item').forEach(it=>{
        it.addEventListener('click', ()=>{
          document.querySelectorAll('.tab-btn')[0].click();
          loadSurah(parseInt(it.dataset.surah)).then(()=>{
            setTimeout(()=>{
              const target = document.querySelector(`.verse[data-verse-num="${it.dataset.verse}"]`);
              if(target) target.scrollIntoView({behavior:'smooth', block:'center'});
            }, 300);
          });
        });
      });

      if(versesRes.meta && versesRes.meta.last_page > 1){
        const pagerDiv = document.createElement('div');
        pagerDiv.className = 'pager';
        pagerDiv.innerHTML = `
          <button id="prevPage" ${versesRes.meta.current_page<=1?'disabled':''}>← Önceki</button>
          <span style="align-self:center;font-family:'IBM Plex Mono',monospace;font-size:0.8rem;color:var(--muted);">
            ${versesRes.meta.current_page} / ${versesRes.meta.last_page}
          </span>
          <button id="nextPage" ${versesRes.meta.current_page>=versesRes.meta.last_page?'disabled':''}>Sonraki →</button>
        `;
        el.appendChild(pagerDiv);
        document.getElementById('prevPage')?.addEventListener('click', ()=> searchRoot(chars, page-1));
        document.getElementById('nextPage')?.addEventListener('click', ()=> searchRoot(chars, page+1));
      }
    }
  }catch(e){
    el.innerHTML = `<div class="empty-state">Bu kök bulunamadı. Harfleri kontrol edin (örn: Hmd, slm, rHm).</div>`;
    console.error(e);
  }
}

init();
</script>
